name: CI Quality & Test Suite

on:
  push:
    branches: [main, master, "**"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Checking
        run: npm run lint

      - name: Execute Vitest Test Suite
        run: npm test

      # Note: Native Tauri build (npm run tauri build) is intentionally omitted from CI until
      # system GUI libraries (libwebkit2gtk-4.1-dev, libappindicator3-dev, librsvg2-dev)
      # are provisioned on the CI runner environment.
