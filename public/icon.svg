<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Label tag outline -->
  <rect x="76" y="106" width="360" height="300" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="8" />
  
  <!-- Header row on tag -->
  <rect x="110" y="140" width="180" height="24" rx="6" fill="#1e293b" />
  <rect x="110" y="174" width="120" height="14" rx="4" fill="#64748b" />
  
  <!-- Big Price block -->
  <rect x="310" y="136" width="96" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3" />
  <text x="358" y="174" font-family="sans-serif" font-weight="900" font-size="28" fill="#1d4ed8" text-anchor="middle">12€</text>
  
  <!-- Barcode on tag -->
  <g fill="#0f172a">
    <rect x="110" y="240" width="10" height="110" rx="3"/>
    <rect x="128" y="240" width="6" height="110" rx="2"/>
    <rect x="140" y="240" width="16" height="110" rx="4"/>
    <rect x="164" y="240" width="8" height="110" rx="2"/>
    <rect x="180" y="240" width="14" height="110" rx="3"/>
    <rect x="202" y="240" width="6" height="110" rx="2"/>
    <rect x="216" y="240" width="18" height="110" rx="4"/>
    <rect x="242" y="240" width="10" height="110" rx="3"/>
    <rect x="260" y="240" width="8" height="110" rx="2"/>
    <rect x="276" y="240" width="14" height="110" rx="3"/>
    <rect x="298" y="240" width="6" height="110" rx="2"/>
    <rect x="312" y="240" width="16" height="110" rx="4"/>
    <rect x="336" y="240" width="8" height="110" rx="2"/>
    <rect x="352" y="240" width="12" height="110" rx="3"/>
    <rect x="372" y="240" width="8" height="110" rx="2"/>
    <rect x="388" y="240" width="14" height="110" rx="3"/>
  </g>
  
  <!-- Laser Beam Scanner line -->
  <rect x="80" y="290" width="352" height="8" rx="4" fill="url(#scanGrad)" />
  <circle cx="256" cy="294" r="7" fill="#38bdf8" />
</svg>
